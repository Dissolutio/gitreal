name: Bundle check

on:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/workflows/bundle-check.yml
      - src-tauri/tauri.conf.json
      - src-tauri/gitreal.desktop
      - src-tauri/icons/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: lts/*
          cache: pnpm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          workspaces: src-tauri -> target
          shared-key: bundle-check
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - run: pnpm install --frozen-lockfile
      - name: Set release version
        run: |
          echo "VERSION=0.1.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          const version = `0.1.${process.env.GITHUB_RUN_NUMBER}`;
          const cargoPath = 'src-tauri/Cargo.toml';
          const cargo = readFileSync(cargoPath, 'utf8');
          const updatedCargo = cargo.replace(/^version = "[^"]+"$/m, `version = "${version}"`);
          if (updatedCargo === cargo) throw new Error('Could not update Cargo.toml version');
          writeFileSync(cargoPath, updatedCargo);

          const tauriPath = 'src-tauri/tauri.conf.json';
          const tauri = JSON.parse(readFileSync(tauriPath, 'utf8'));
          tauri.version = version;
          writeFileSync(tauriPath, `${JSON.stringify(tauri, null, 2)}\n`);

          const packagePath = 'package.json';
          const packageJson = JSON.parse(readFileSync(packagePath, 'utf8'));
          packageJson.version = version;
          writeFileSync(packagePath, `${JSON.stringify(packageJson, null, 2)}\n`);
          NODE
      - name: Build and sign bundles
        run: |
          pnpm tauri signer generate --ci -w "$RUNNER_TEMP/check.key"
          export TAURI_SIGNING_PRIVATE_KEY="$(cat "$RUNNER_TEMP/check.key")"
          export TAURI_SIGNING_PRIVATE_KEY_PASSWORD=""
          pnpm tauri build --bundles appimage,deb
      - name: Verify bundles
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir="src-tauri/target/release/bundle"
          mapfile -t appimages < <(find "$bundle_dir" -type f -name '*.AppImage')
          mapfile -t debs < <(find "$bundle_dir" -type f -name '*.deb')

          if [ "${#appimages[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one AppImage under $bundle_dir; found ${#appimages[@]}."
            exit 1
          fi
          if [ ! -f "${appimages[0]}.sig" ]; then
            echo "::error::Missing updater signature for ${appimages[0]}."
            exit 1
          fi
          if [ "${#debs[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one .deb under $bundle_dir; found ${#debs[@]}."
            exit 1
          fi

          extract_dir="$(mktemp -d)"
          trap 'rm -rf "$extract_dir"' EXIT
          (
            cd "$extract_dir"
            "$GITHUB_WORKSPACE/${appimages[0]}" --appimage-extract >/dev/null
          )
          appdir="$extract_dir/squashfs-root"
          if [ ! -f "$appdir/usr/bin/gitreal" ]; then
            echo "::error::AppImage is missing usr/bin/gitreal."
            exit 1
          fi
          if ! find "$appdir" -type f -name '*.desktop' -print -quit | grep -q .; then
            echo "::error::AppImage is missing a .desktop entry."
            exit 1
          fi
          if ! find "$appdir" -type f \( -iname '*.png' -o -iname '*.svg' -o -iname '*.ico' \) -print -quit | grep -q .; then
            echo "::error::AppImage is missing an icon."
            exit 1
          fi

          deb_contents="$(dpkg-deb -c "${debs[0]}")"
          echo "::group::.deb contents"
          printf '%s\n' "$deb_contents"
          echo "::endgroup::"
          if ! grep -Eq '[[:space:]]\./usr/bin/gitreal([[:space:]]|$)' <<<"$deb_contents"; then
            echo "::error::.deb is missing usr/bin/gitreal."
            exit 1
          fi
          if ! grep -Eq '[[:space:]]\./usr/share/applications/[^[:space:]]+\.desktop([[:space:]]|$)' <<<"$deb_contents"; then
            echo "::error::.deb is missing usr/share/applications/*.desktop."
            exit 1
          fi
          if ! grep -Eq '[[:space:]]\./usr/share/(icons|pixmaps)/' <<<"$deb_contents"; then
            echo "::error::.deb is missing application icons."
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bundle-check-linux
          path: |
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.AppImage.sig
            src-tauri/target/release/bundle/**/*.deb
          if-no-files-found: error
          retention-days: 3
