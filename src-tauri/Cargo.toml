[package]
name = "gitreal"
version = "0.1.0"
description = "A read-only Git history explorer"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gitreal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }

[dependencies]
tauri = { version = "=2.12.0", features = ["tray-icon"] }
tauri-plugin-dialog = "=2.8.0"
tauri-plugin-single-instance = "=2.4.0"
gix = { version = "=0.91.0", default-features = false, features = ["revision", "sha1", "blob-diff"] }
libc = "=0.2.191"
notify = "=8.2.0"
serde = { version = "=1.0.228", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "=2.0.18"
tokio = { version = "=1.50.0", features = ["rt", "sync"] }
toml = "=0.9.12"

[dev-dependencies]
tempfile = "=3.27.0"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
